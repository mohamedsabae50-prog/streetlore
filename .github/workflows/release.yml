name: Streetlore Release Build

# Builds the arm64 release APK on Ubuntu and publishes it to the
# GitHub Release that matches the resolved tag. Triggers:
#   - manual `workflow_dispatch` with a `tag` input (recommended for
#     bypass-local-Windows builds)
#   - push of a v* tag (so the next release can be auto-built by
#     `git push origin v1.0.38 --force`)
#   - push to main (build only - no release upload - for CI sanity)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.37). Leave blank to auto-resolve.'
        required: false
        default: ''
      create_release:
        description: 'Create / update the GitHub Release with this tag?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# Avoid running two release-build jobs for the same ref.
concurrency:
  group: streetlore-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build + Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin a major that matches the local dev box (3.44.x here)
          # so the same Dart SDK constraint in pubspec.yaml resolves
          # to the same package versions. Override with the actual
          # version you want if you have a preference.
          flutter-version: 3.44.x
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Resolve target version tag
        id: resolve_tag
        run: |
          set -e
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Fall back to the most recent v* tag on the repo, else
            # v1.0.37 for the first build. We don't error here so the
            # workflow can still run as a build-only sanity check.
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
            TAG="${latest:-v1.0.37}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: ${TAG}"

      - name: Decode Keystore
        env:
          # v1.0.73: passwords now sourced from secrets instead of
          # being baked into the keystore / build script. The literal
          # password is still the fallback for local dev (kept in
          # sync with the comment in app/build.gradle.kts).
          STREETLORE_KEYSTORE_PASSWORD: ${{ secrets.STREETLORE_KEYSTORE_PASSWORD }}
          STREETLORE_KEY_PASSWORD: ${{ secrets.STREETLORE_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/app
          # No `if:` guard. The previous conditional
          # `if: env.KEYSTORE_B64 != ''` was getting evaluated as
          # false even when the secret existed (a known GitHub
          # Actions env-step quirk), so the file never got written.
          # We now inline the secret expression and let the step
          # always run. If the secret is missing the resulting
          # file is empty and the Verify step below will error out
          # with a helpful message.
          echo "${{ secrets.STREETLORE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release_v2.keystore
          chmod 600 android/app/release_v2.keystore
          SIZE=$(wc -c < android/app/release_v2.keystore)
          echo "Wrote $SIZE bytes to android/app/release_v2.keystore"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::release_v2.keystore is too small ($SIZE bytes). The STREETLORE_KEYSTORE_BASE64 secret is probably unset or truncated. Add it (base64 of \$ANDROID_KEYSTORE_PATH) and re-run."
            exit 1
          fi

      - name: Verify keystore signature
        env:
          STREETLORE_KEYSTORE_PASSWORD: ${{ secrets.STREETLORE_KEYSTORE_PASSWORD }}
        run: |
          set -e
          SHA=$(keytool -list -v -keystore android/app/release_v2.keystore -storepass "${STREETLORE_KEYSTORE_PASSWORD:-streetlore2026}" 2>&1 | grep -E '^\s*SHA1:' | head -n 1 | awk '{print $2}')
          echo "Keystore cert SHA-1: ${SHA}"
          # v1.0.73: the expected SHA-1 below is the SHA-1 of the
          # v1.0.30+ production keystore. To regenerate from a brand-
          # new keystore, run:
          #   keytool -list -v -keystore android/app/release_v2.keystore \
          #     -storepass "$STREETLORE_KEYSTORE_PASSWORD" \
          #     | grep -E '^\s*SHA1:'
          # then update this check (and the Google Cloud OAuth client
          # for Google Sign-In) to match.
          if [ "${SHA}" != "AF:62:89:44:B5:F3:A0:0A:4E:CE:1E:72:34:13:26:EA:5A:E7:B4:8F" ]; then
            echo "::error::Cert SHA-1 is ${SHA} - expected the v1.0.30+ keystore cert. Refusing to publish."
            exit 1
          fi
          echo "Keystore cert matches the registered v1.0.30+ cert."

      - name: Install dependencies
        run: flutter pub get

      - name: Materialise dart-define JSON
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -e
          # v1.0.43 fix: previous builds used shell interpolation
          # `--dart-define=GEMINI_API_KEYS="${GEMINI_KEYS}"` which
          # silently broke when the secret value contained a `$`,
          # `"`, `\` or `=` (the user confirmed the AI Tour Guide
          # was returning "(Error: 404)" / no response at all in
          # v1.0.42). We now write the value to a JSON file and
          # pass it to flutter via `--dart-define-from-file`,
          # which bypasses shell escaping entirely.
          #
          # v1.0.45+ obfuscation: the value is base64-encoded before
          # being placed in the JSON map. AppConfig.base64-decodes
          # it at runtime. This prevents GitHub Push Protection
          # from detecting GCP API key patterns when the compiled
          # JS bundle is pushed to streetlore-web-app (see the
          # local build script for the symmetric encode).
          if [ -z "${GEMINI_KEYS}" ]; then
            echo "::error::GEMINI_API_KEYS GitHub secret is missing. Add it (5 keys, comma-separated) and re-run."
            exit 1
          fi
          KEY_COUNT=$(echo "${GEMINI_KEYS}" | tr ',' '\n' | wc -l)
          echo "GEMINI_API_KEYS loaded: ${#GEMINI_KEYS} chars, ${KEY_COUNT} comma-separated entries"
          # Base64-encode the comma-joined key blob, then wrap it in
          # a single-entry JSON map. We do both inside one python
          # invocation to avoid leaking the raw keys into process
          # listings via intermediate shell variables.
          python3 - <<'PY' > /tmp/dart_defines.json
          import json, sys, base64, os
          raw = os.environ["GEMINI_KEYS"].rstrip("\n")
          encoded = base64.b64encode(raw.encode("utf-8")).decode("ascii")
          sys.stdout.write(json.dumps({"GEMINI_API_KEYS": encoded}))
          PY
          echo "Wrote $(wc -c < /tmp/dart_defines.json) bytes to /tmp/dart_defines.json"
          # Sanity: decode the value back and confirm key count.
          PARSED_COUNT=$(python3 -c '
          import json, base64
          raw = json.load(open("/tmp/dart_defines.json"))["GEMINI_API_KEYS"]
          decoded = base64.b64decode(raw).decode("utf-8")
          print(len([k for k in decoded.split(",") if k.strip()]))
          ')
          if [ "${PARSED_COUNT}" -lt 1 ]; then
            echo "::error::Parsed GEMINI_API_KEYS has 0 entries. Check the GitHub secret value."
            exit 1
          fi
          echo "Parsed entries from JSON (after base64 decode): ${PARSED_COUNT}"

      - name: Build APK + AAB (arm64, release)
        run: |
          set -e
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define-from-file=/tmp/dart_defines.json
          # v1.0.74: also produce the Android App Bundle that the Play
          # Store actually accepts (App Bundles are the mandatory upload
          # format for every new app since Aug 2021).
          flutter build appbundle \
            --target-platform android-arm64 \
            --dart-define-from-file=/tmp/dart_defines.json

      - name: Compute APK hashes
        id: hashes
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SIZE=$(wc -c < "$APK")
          SHA1=$(sha1sum "$APK" | awk '{print $1}')
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Size:    $SIZE bytes"
          echo "SHA-1:   $SHA1"
          echo "SHA-256: $SHA256"

      - name: Rename APK
        run: |
          set -e
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.apk"
          ls -la build/app/outputs/flutter-apk/

      - name: Rename AAB
        run: |
          set -e
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            mv build/app/outputs/bundle/release/app-release.aab \
               "build/app/outputs/bundle/release/streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.aab"
          fi
          ls -la build/app/outputs/bundle/release/ 2>/dev/null || true

      - name: Upload to GitHub Release
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == '') || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: 'Streetlore ${{ steps.resolve_tag.outputs.tag }}'
          body: |
            ## Streetlore ${{ steps.resolve_tag.outputs.tag }} (GitHub Actions build)

            Built on `ubuntu-latest` from commit `${{ github.sha }}`.
            `flutter analyze`: see commit log.
            Same keystore as v1.0.30+ (cert SHA-1 `AF:62:89:44:B5:F3:A0:0A:4E:CE:1E:72:34:13:26:EA:5A:E7:B4:8F`).
            Same 5-key Gemini rotation + official `google_generative_ai` SDK + model fallback chain as in source.

            ### Assets

            | File | Purpose |
            |---|---|
            | `streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.apk` | Sideload install / non-Play distribution |
            | `streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.aab` | **Google Play upload** (recommended) |

            - APK Size:    ${{ steps.hashes.outputs.size }} bytes
            - APK SHA-1:   `${{ steps.hashes.outputs.sha1 }}`
            - APK SHA-256: `${{ steps.hashes.outputs.sha256 }}`
          files: |
            build/app/outputs/flutter-apk/streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.apk
            build/app/outputs/bundle/release/streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.aab
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Upload APK as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64-apk
          path: build/app/outputs/flutter-apk/streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64-aab
          path: build/app/outputs/bundle/release/streetlore-${{ steps.resolve_tag.outputs.tag }}-arm64.aab
          if-no-files-found: error
          retention-days: 14
