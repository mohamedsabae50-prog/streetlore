<!DOCTYPE html>
<html>
<head>
  <!--
    Base href placeholder. Replaced by --base-href at build time.
    v1.0.45: Flutter 3.44+ requires the literal "$FLUTTER_BASE_HREF"
    placeholder; a hardcoded path (e.g. "/streetlore-web-app/") causes
    `flutter build web --release --base-href ...` to fail with
    "Couldn't find the placeholder for base href".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Discover Egypt's hidden stories with EgyptLore.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EgyptLore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EgyptLore</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #060d1a url("assets/assets/images/splash_bg.png") center / cover no-repeat fixed;
    }
    #explorer-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 40%, #14263c 0%, #0d1b2a 52%, #060d1a 100%);
      opacity: 1;
      transition: opacity 250ms ease, visibility 250ms ease;
    }
    #explorer-preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-orbit {
      position: absolute;
      width: min(76vw, 360px);
      aspect-ratio: 1;
      border: 1px solid rgba(212, 175, 55, .22);
      border-radius: 50%;
      box-shadow: inset 0 0 35px rgba(212, 175, 55, .04), 0 0 35px rgba(59, 204, 210, .06);
      animation: orbit 18s linear infinite;
    }
    .preloader-orbit::before, .preloader-orbit::after {
      content: "";
      position: absolute;
      inset: 13%;
      border: 1px solid rgba(212, 175, 55, .19);
      border-radius: 50%;
      animation: sonar 3.2s ease-out infinite;
    }
    .preloader-orbit::after {
      animation-delay: 1.6s;
    }
    .preloader-content {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      color: #f4e7c8;
      font: 500 15px system-ui, sans-serif;
      text-align: center;
    }
    .preloader-logo {
      width: min(42vw, 174px);
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, .38));
      animation: arrive 1.4s cubic-bezier(.2, 1.35, .45, 1) both;
    }
    .preloader-title {
      font: 500 clamp(25px, 6vw, 34px) Georgia, serif;
      letter-spacing: .08em;
    }
    .preloader-tagline {
      color: #e7d6af;
      font-size: 13px;
    }
    .preloader-progress {
      width: 118px;
      height: 2px;
      margin-top: 5px;
      background: linear-gradient(90deg, #d4af37, #f59e0b, #3bccd2);
      background-size: 220% 100%;
      animation: shimmer 1.8s linear infinite;
      box-shadow: 0 0 12px rgba(212, 175, 55, .45);
    }
    @keyframes sonar {
      from { transform: scale(.62); opacity: .7; }
      to { transform: scale(1.42); opacity: 0; }
    }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes arrive {
      from { opacity: 0; transform: scale(.65); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="explorer-preloader" role="status" aria-label="EgyptLore loading">
    <div class="preloader-orbit" aria-hidden="true"></div>
    <div class="preloader-content">
      <img class="preloader-logo" src="assets/assets/images/compass_only.png" alt="">
      <div class="preloader-title">EgyptLore</div>
      <div class="preloader-tagline">Discover the Hidden Stories Around You</div>
      <div class="preloader-progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    (function () {
      var startedAt = Date.now();
      var preloader = document.getElementById('explorer-preloader');
      var hidden = false;

      function hidePreloader() {
        if (hidden) return;
        hidden = true;
        if (preloader) preloader.classList.add('is-hidden');
      }

      var fallbackTimer = window.setTimeout(hidePreloader, 800);
      window.addEventListener('flutter-first-frame', function () {
        window.setTimeout(function () {
          window.clearTimeout(fallbackTimer);
          hidePreloader();
        }, Math.max(0, 700 - (Date.now() - startedAt)));
      }, { once: true });

      var bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=2.1.35-236';
      bootstrap.async = true;
      bootstrap.onerror = function (error) {
        console.error('Unable to load Flutter bootstrap:', error);
      };

      function loadFlutter() {
        document.body.appendChild(bootstrap);
      }

      function clearFlutterCaches(basePath) {
        if (!('caches' in window)) return Promise.resolve();
        return window.caches.keys().then(function (names) {
          return Promise.all(names.filter(function (name) {
            return name.indexOf('flutter-') === 0;
          }).map(function (name) {
            return window.caches.open(name).then(function (cache) {
              return cache.keys().then(function (requests) {
                return Promise.all(requests.filter(function (request) {
                  var url = new URL(request.url);
                  return url.origin === location.origin &&
                    url.pathname.indexOf(basePath) === 0;
                }).map(function (request) {
                  return cache.delete(request);
                }));
              }).then(function () {
                return cache.keys();
              }).then(function (remaining) {
                if (remaining.length === 0) return window.caches.delete(name);
              });
            });
          }));
        });
      }

      var basePath = new URL(document.querySelector('base').href).pathname;
      if (!('serviceWorker' in navigator)) {
        loadFlutter();
        return;
      }

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        var stale = registrations.filter(function (registration) {
          return [registration.active, registration.waiting, registration.installing]
            .some(function (worker) {
              if (!worker) return false;
              var url = new URL(worker.scriptURL);
              return url.origin === location.origin &&
                url.pathname === basePath + 'flutter_service_worker.js';
            });
        });
        return Promise.all(stale.map(function (registration) {
          return registration.unregister();
        })).then(function () {
          return clearFlutterCaches(basePath);
        });
      }).then(loadFlutter).catch(function (error) {
        console.error('Unable to clear the legacy Flutter service worker:', error);
        loadFlutter();
      });
    })();
  </script>
</body>
</html>
